[preset.0]

name="Windows Release"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.mp3, *.ogv, third_party/licenses/*.txt, assets/fonts/game_deck/OFL.txt, assets/input_icons/ATTRIBUTION.md, assets/skins/ATTRIBUTION.md, THIRD_PARTY_NOTICES.md, LICENSE, addons/dialogue_manager/LICENSE, addons/tile_bit_tools/LICENSE, addons/exit_portal_free/LICENSE, addons/exit_portal_free/ATTRIBUTION.md"
; Recovery mode disables Dialogue Manager's EditorExportPlugin as well as its
; tool scripts. Preserve its editor-widget exclusion explicitly, including the
; two editor entrypoints that preload those widgets. Runtime dialogue stays.
exclude_filter="*.mp4, *.cs, .env, .env.*, *.pem, *.key, *.p12, *.pfx, export_credentials.cfg, proto3d/tests/realm_fixture_*, addons/dialogue_manager/components/*, addons/dialogue_manager/views/*, addons/dialogue_manager/plugin.gd, addons/dialogue_manager/inspector_plugin.gd"
export_path="../build/DRIVN.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.14.0.0"
application/product_version="0.14.0.0"
application/company_name="Machine Kings Media"
application/product_name="DRIVN"
application/file_description="Vehicular survival in the Divided States of America"
application/copyright="(c) 2026 Machine Kings Media"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
