<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSOA World Forge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231c1712'/%3E%3Cpath d='M6 22h20l-3 5H9zM10 22l2-8h8l2 8M13 14l3-9 3 9' fill='none' stroke='%23e3a72f' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Big+Shoulders+Stencil+Display:wght@800;900&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/forge/forge.css" />
</head>
<body>
  <header class="bar">
    <div class="brand" title="THE WORLD FORGE: every layer of the world as data rows, edited here, pushed into the running game">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 23h22l-3.5 5h-15zM10 23l2-8h8l2 8M12.5 15l3.5-10 3.5 10" /></svg>
      <div class="brand-text"><b>WORLD FORGE</b><span>DIVIDED STATES · WORLD EDITOR</span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="bar-right">
      <button class="tabchip" id="tabchip" title="Which game tab the forge pushes into and drives (click to pick)"><i class="led" id="led"></i><span id="tabname">NO GAME</span><small id="tabkind"></small></button>
      <div class="health" id="health" title="Live health: the game tab, the shard server, the headless harness, the forge's files"></div>
      <label class="livepush" title="Push every write into the attached game at once (forgePush)"><input type="checkbox" id="livePush" checked /><span>LIVE</span></label>
      <button class="btn ghost" id="btnPalette" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/><path d="M20.2 18.2L22 20"/></svg><kbd>Ctrl K</kbd></button>
      <button class="btn ghost" id="btnHelp" title="How to use this tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.6 2.6 0 0 1 5 .9c0 1.7-2.6 2.2-2.6 3.9M12 17.2v.1"/></svg><span>HOW TO USE</span></button>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <footer class="status" id="status">
    <span class="st-file" id="stFiles">—</span>
    <span class="st-sep"></span>
    <span class="st-undo" id="stUndo">—</span>
    <span class="st-sep"></span>
    <span class="st-check" id="stCheck">—</span>
    <span class="st-push" id="stPush">—</span>
    <span class="st-hint" id="stHint">every click here is a COMMANDS row · <code>node tools/dl.mjs forge</code></span>
  </footer>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="dh"><h2 id="drawerTitle">HOW TO USE</h2><button class="x" id="drawerClose" title="Close (Esc)">×</button></header>
    <div class="db" id="drawerBody"></div>
  </aside>
  <div class="toasts" id="toasts"></div>
  <div class="palette hidden" id="palette"><div class="pbox"><input id="palInput" placeholder="Type a command, a town, an exit, a site…" autocomplete="off" spellcheck="false" /><ol id="palList"></ol><footer>↑↓ to move · Enter to run · Esc to close</footer></div></div>
  <dialog id="modal" class="modal"><form method="dialog" id="modalForm"><header class="mh"><h3 id="modalTitle">—</h3><button class="x" value="cancel" title="Close">×</button></header><div class="mb" id="modalBody"></div><footer class="mf" id="modalFoot"></footer></form></dialog>
  <script type="module" src="/src/forge/forge.js"></script>
</body>
</html>
