<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Divided States of America</title>
  <meta name="application-name" content="Divided States of America" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- A gold star split down the middle, on blackened steel: the country, divided. Inline, so the tab never 404s. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231c1712'/%3E%3Cpath d='M16 3.5l3.6 7.8 8.5.9-6.4 5.8 1.8 8.4L16 22.2l-7.5 4.2 1.8-8.4-6.4-5.8 8.5-.9z' fill='%23e3a72f'/%3E%3Cpath d='M12.5 2.5l7 27' stroke='%231c1712' stroke-width='2.2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- HUD faces, all Google Fonts under the OFL (Barlow Condensed, Inter, Overpass, Big Shoulders Stencil Display) or Apache 2.0 (Special Elite). -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Overpass:wght@600;700&family=Big+Shoulders+Stencil+Display:wght@800;900&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/ui/hud.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script>
    // Agent QOL: forward page errors (syntax errors, crashes) to the dev bridge so
    // `node tools/dl.mjs status` explains why the game tab is not responding.
    (function () {
      const send = (kind, message, where) => { try { fetch('/agent/client-error', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind, message: String(message).slice(0, 500), where, at: Date.now() }) }); } catch (e) {} };
      addEventListener('error', (e) => send('error', e.message, e.filename ? e.filename.replace(location.origin, '') + ':' + e.lineno + ':' + e.colno : ''));
      addEventListener('unhandledrejection', (e) => send('unhandledrejection', e.reason && (e.reason.stack || e.reason.message) || e.reason, ''));
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
