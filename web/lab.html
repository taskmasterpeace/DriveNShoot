<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Building Lab</title>
  <link rel="stylesheet" href="/src/lab/lab.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="mark" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 11h9v10.5M11.5 6v5M15 11h6.5M15 11v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div><h1>BUILDING LAB</h1><p>Divided States · the ring's own generators, by hand</p></div>
    </div>
    <nav class="tools" id="tools" aria-label="Tools">
      <button data-tool="select" class="pill on" title="Select / drag walls, doors and stairs (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Select</button>
      <button data-tool="wall" class="pill" title="Split a room with a wall (W) - Shift turns it"><svg viewBox="0 0 24 24"><path d="M12 3v18M4 3h16v18H4z"/></svg>Wall</button>
      <button data-tool="door" class="pill" title="Add a doorway on a wall, or click one to remove it (D)"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 20V5h7v15M14 5a7 7 0 0 1 0 15"/></svg>Door</button>
      <button data-tool="hall" class="pill" title="Carve a hallway through a room: drag along it (H)"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M7 12h2M11 12h2M15 12h2"/></svg>Hall</button>
      <span class="sub" id="hallW" hidden>
        <button data-w="1.3" class="chip">1.3</button><button data-w="1.8" class="chip on">1.8</button><button data-w="2.4" class="chip">2.4 m</button>
      </span>
    </nav>
    <div class="acts">
      <button id="undo" class="ghost" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="redo" class="ghost" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button id="reroll" class="btn" title="A new seed (R)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3"/><circle cx="16" cy="16" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>Reroll</button>
      <button id="pin" class="btn" title="Pin this plan"><svg viewBox="0 0 24 24"><path d="M12 17v5M5 17h14l-2-4V5h1V3H6v2h1v8z"/></svg>Pin</button>
      <button id="export" class="btn primary" title="Export the building as a data row"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>Export</button>
    </div>
  </header>

  <main class="lab">
    <aside class="side">
      <section>
        <h2>Kind</h2>
        <div class="kinds" id="kinds"></div>
      </section>
      <section>
        <h2>Footprint</h2>
        <label class="slider"><span>Width</span><input type="range" id="w" min="6" max="60" step="0.1" /><output id="wOut"></output></label>
        <label class="slider"><span>Depth</span><input type="range" id="d" min="6" max="60" step="0.1" /><output id="dOut"></output></label>
        <div class="row2">
          <div><span class="lbl">Front</span><div class="compass" id="front"><button data-f="N">N</button><button data-f="W">W</button><button data-f="E">E</button><button data-f="S">S</button></div></div>
          <div><span class="lbl">Units</span><div class="stepper"><button id="uMinus" class="ghost">−</button><output id="units">1</output><button id="uPlus" class="ghost">+</button></div></div>
        </div>
        <span class="lbl">Zone (palette, loot)</span>
        <div class="chips" id="zones"></div>
        <span class="lbl">Seed</span>
        <div class="seedrow"><input id="seed" type="number" /><button id="reroll2" class="ghost" title="Reroll">↻</button></div>
      </section>
      <section class="planinfo" id="planinfo"></section>
      <section>
        <h2>Pinned <span class="count" id="pinCount"></span></h2>
        <div class="pins" id="pins"><p class="empty">Pin a plan you like - it stays here (this browser).</p></div>
      </section>
    </aside>

    <section class="plan">
      <div class="floorbar">
        <div class="floors" id="floors"></div>
        <button id="addStorey" class="btn sm"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Storey</button>
        <button id="delStorey" class="ghost sm" title="Take the top storey off">Remove top</button>
        <span class="hint" id="hint"></span>
      </div>
      <canvas id="plan2d"></canvas>
      <div class="inspector" id="inspector" hidden></div>
    </section>

    <section class="right">
      <div class="view3d">
        <canvas id="view3d"></canvas>
        <div class="viewbar">
          <div class="seg" id="roofSeg"><button data-roof="1" class="on">Roof</button><button data-roof="0">Cutaway</button></div>
          <div class="seg" id="camSeg"><button data-cam="orbit" class="on">Orbit</button><button data-cam="top">Top</button></div>
        </div>
        <div class="caption" id="caption"></div>
      </div>
      <div class="proof" id="proof"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden><div class="card" role="dialog" aria-modal="true"><button class="x ghost" id="modalX" aria-label="Close">×</button><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/src/lab/lab.js"></script>
</body>
</html>
