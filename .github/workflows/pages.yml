# THE PLAY LINK: every push to main builds the web game (web/, vite) on GitHub's runners and publishes it to GitHub Pages,
# so it plays in any browser, phone and tablet included: https://taskmasterpeace.github.io/DriveNShoot/
# Static only: the agent bridge, THE WORLD FORGE's file side and the shard server are dev-server parts and stay off it.
name: play link (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Pages serves the repo at /DriveNShoot/: every asset path goes through import.meta.env.BASE_URL.
      - run: npx vite build --base=/DriveNShoot/
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
